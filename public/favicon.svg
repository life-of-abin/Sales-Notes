<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E0A45" />
      <stop offset="50%" stopColor="#5B1EE6" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>

    <!-- Notebook Cover Gradient -->
    <linearGradient id="nbCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FFE066" />
      <stop offset="50%" stopColor="#F5B318" />
      <stop offset="100%" stopColor="#DF8E00" />
    </linearGradient>

    <!-- Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#8B5CF6" />
      <stop offset="50%" stopColor="#6D28D9" />
      <stop offset="100%" stopColor="#4C1D95" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldCoinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FFF176" />
      <stop offset="40%" stopColor="#FFCA28" />
      <stop offset="100%" stopColor="#DF8E00" />
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" floodColor="#090218" floodOpacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Glass Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.2)" strokeWidth="8" />

  <!-- Central Assembly -->
  <g transform="translate(46, 40)">
    <!-- 1. Notebook Component -->
    <g filter="url(#shadow)">
      <!-- Main Book -->
      <rect x="70" y="50" width="280" height="320" rx="36" fill="url(#nbCover)" />
      
      <!-- Bookmark Ribbon -->
      <path d="M250 26 L310 26 L310 110 L280 88 L250 110 Z" fill="#6D28D9" />

      <!-- Ring Binders -->
      <circle cx="70" cy="110" r="18" fill="#FFCA28" stroke="#DF8E00" strokeWidth="5" />
      <circle cx="70" cy="180" r="18" fill="#FFCA28" stroke="#DF8E00" strokeWidth="5" />
      <circle cx="70" cy="250" r="18" fill="#FFCA28" stroke="#DF8E00" strokeWidth="5" />
      <circle cx="70" cy="320" r="18" fill="#FFCA28" stroke="#DF8E00" strokeWidth="5" />

      <!-- Mini Calculator on Notebook -->
      <rect x="235" y="130" width="90" height="85" rx="14" fill="#3B0764" />
      <rect x="245" y="140" width="70" height="18" rx="4" fill="#8B5CF6" />
      <!-- Calculator Keypad Dots -->
      <rect x="245" y="166" width="16" height="12" rx="3" fill="#F5B318" />
      <rect x="272" y="166" width="16" height="12" rx="3" fill="#F5B318" />
      <rect x="299" y="166" width="16" height="12" rx="3" fill="#F5B318" />
      <rect x="245" y="186" width="16" height="12" rx="3" fill="#F5B318" />
      <rect x="272" y="186" width="16" height="12" rx="3" fill="#F5B318" />
      <rect x="299" y="186" width="16" height="12" rx="3" fill="#F5B318" />

      <!-- Ledger Lines -->
      <line x1="120" y1="130" x2="200" y2="130" stroke="#4C1D95" strokeWidth="8" strokeLinecap="round" />
      <line x1="120" y1="160" x2="200" y2="160" stroke="#4C1D95" strokeWidth="8" strokeLinecap="round" />
      <line x1="120" y1="190" x2="200" y2="190" stroke="#4C1D95" strokeWidth="8" strokeLinecap="round" />

      <!-- Clothes Hanger Icon -->
      <path d="M190 240 C190 225 205 225 205 235 C205 245 190 250 190 260 L140 295 L240 295 L205 270" stroke="#4C1D95" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" fill="none" />
    </g>

    <!-- 2. Folded Violet Shirt Component -->
    <g transform="translate(45, 140)" filter="url(#shadow)">
      <path d="M30 70 L110 35 L190 70 L210 180 C210 198 198 206 180 206 L40 206 C22 206 10 198 10 180 Z" fill="url(#shirtGrad)" />
      
      <!-- Collar -->
      <path d="M55 58 L110 115 L85 45 Z" fill="#6D28D9" stroke="#FFD043" strokeWidth="5" />
      <path d="M165 58 L110 115 L135 45 Z" fill="#6D28D9" stroke="#FFD043" strokeWidth="5" />
      <path d="M92 42 L110 60 L128 42 Z" fill="#FFCA28" />

      <!-- Placket and Gold Buttons -->
      <line x1="110" y1="108" x2="110" y2="196" stroke="#3B0764" strokeWidth="10" strokeLinecap="round" />
      <circle cx="110" cy="130" r="6" fill="#FFD043" stroke="#DF8E00" strokeWidth="2" />
      <circle cx="110" cy="158" r="6" fill="#FFD043" stroke="#DF8E00" strokeWidth="2" />
      <circle cx="110" cy="186" r="6" fill="#FFD043" stroke="#DF8E00" strokeWidth="2" />
    </g>

    <!-- 3. Golden Coins Stack Component -->
    <g transform="translate(190, 210)" filter="url(#shadow)">
      <!-- Coin 1 (Bottom) -->
      <ellipse cx="100" cy="130" rx="72" ry="28" fill="#C97800" />
      <ellipse cx="100" cy="122" rx="72" ry="28" fill="url(#goldCoinGrad)" />

      <!-- Coin 2 (Middle) -->
      <ellipse cx="100" cy="102" rx="72" ry="28" fill="#C97800" />
      <ellipse cx="100" cy="94" rx="72" ry="28" fill="url(#goldCoinGrad)" />

      <!-- Coin 3 (Top with ₹ Rupee Symbol) -->
      <ellipse cx="100" cy="74" rx="76" ry="32" fill="#C97800" />
      <ellipse cx="100" cy="62" rx="76" ry="32" fill="url(#goldCoinGrad)" />
      <ellipse cx="100" cy="62" rx="66" ry="26" fill="none" stroke="#FFF59D" strokeWidth="3" />

      <text x="100" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#1E0A45">
        ₹
      </text>
    </g>
  </g>
</svg>